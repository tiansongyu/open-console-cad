<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="10.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">公开尺寸</text><text x="10.0000" y="26.0000" font-size="3.2" text-anchor="start" fill="#141413">整机 272 × 116 × 13.9 mm，含摇杆/扳机最大厚 30.7 mm。</text><text x="10.0000" y="34.0000" font-size="3.2" text-anchor="start" fill="#141413">手柄含连接突起宽 41.4 mm，主机单体宽 198 mm 为近似。</text><text x="10.0000" y="42.0000" font-size="3.2" text-anchor="start" fill="#141413">底座 201 × 115 × 51.2 mm。</text><text x="10.0000" y="59.0000" font-size="4" text-anchor="start" fill="#1B365D">模型范围</text><text x="10.0000" y="69.0000" font-size="3.2" text-anchor="start" fill="#141413">局部壁厚、孔位、紧固件和安装间隙为近似设计。</text><text x="10.0000" y="77.0000" font-size="3.2" text-anchor="start" fill="#141413">电池、主板、芯片、风扇和控制器内部为主要模块布局示意。</text><text x="10.0000" y="85.0000" font-size="3.2" text-anchor="start" fill="#141413">尺寸数字描述此版模型，不能代替制造方工程资料。</text><text x="10.0000" y="102.0000" font-size="4" text-anchor="start" fill="#1B365D">验证文件</text><text x="10.0000" y="112.0000" font-size="3.2" text-anchor="start" fill="#141413">15 轮设计迭代和每轮模型保存在 iterations/。</text><text x="10.0000" y="120.0000" font-size="3.2" text-anchor="start" fill="#141413">15_interference_audit.json：完整实体干涉核验。</text><text x="10.0000" y="128.0000" font-size="3.2" text-anchor="start" fill="#141413">parameter_edit_test.json、rebuild_verification.json：参数与源码重建。</text><text x="10.0000" y="136.0000" font-size="3.2" text-anchor="start" fill="#141413">export_roundtrip_audit.json、drawing_checks.json：导出回读与尺寸检查。</text><text x="10.0000" y="157.0000" font-size="4" text-anchor="start" fill="#1B365D">参考来源</text><text x="10.0000" y="167.0000" font-size="3.2" text-anchor="start" fill="#141413">Nintendo 官方产品规格、Joy-Con/底座规格、部位图和数字手册。</text><text x="10.0000" y="175.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 2025 年 Nintendo Switch 2 现场拆解：主要内部模块布局。</text><text x="10.0000" y="183.0000" font-size="3.2" text-anchor="start" fill="#141413">完整链接与尺寸依据见 references/SOURCES.md。</text><text x="385.0000" y="210.0000" font-size="3.2" text-anchor="end" fill="#141413">CAD STUDY · 2026.09.08</text></svg>
