<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">资料与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">Sony 2013 发布规格给出约 275 × 305 × 53 mm 主体包络。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 首发主机与 JDM-001 控制器拆解提供结构布局依据。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">2013 官方 FAQ 确认套装；后期指南仅指导单耳耳机局部外形。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">近似与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">Sony 主体尺寸原注为暂定、近似，且不含最大突出部。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">壳体分割、壁厚、孔位、元件、机构和线束均按学习用途近似绘制。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">不复现制造公差、生产电路、游戏数据或经过验证的运动。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可核对的检查记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">29 轮源码 / 1039 组件 / 1133 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">完整重建、严格实体、装配求交和 STEP 回读分别保留报告。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">字体、逐页视觉、模型尺寸与原生图纸引用随交付检查。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改的入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">主要源码：tools/cadlib/ps4.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；修改后同步更新 CAD、图纸与网页。</text></svg>