<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">公开规格</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">任天堂 Game Boy Classic：90 × 148 × 32 mm 完整包络。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">单色 LCD 显示区 47 × 43 mm；160 × 144 像素。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">四节 AA 电池、对比度/音量调节、通信口与立体声耳机。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">参考与近似范围</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">任天堂技术数据页与 iFixit DMG-01 拆机（指南 122657）。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">主板采用所参考修订版的布局，不代表每一批次的细节。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">壁厚、封装、接点、卡带和安装间隙为近似研究几何。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">验证记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">15 轮源码；410 个组件条目参与重建核对。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生装配、STEP 回读、组件相交和直接尺寸分别检查。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">图册使用 Kami，包含字体、内容覆盖与逐页视觉检查。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">维护入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">来源：references/SOURCES.md；零件清单：COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">逐轮入口：scripts/iterNN_*.py；实现：tools/cadlib/gameboy.py。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">网页 GLB 与原生 CAD 的身份关联见输出与网页模型清单。</text></svg>