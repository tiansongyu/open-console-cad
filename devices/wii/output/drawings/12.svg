<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">来源与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">任天堂硬件页和说明书：尺寸、原始接口、配件与控制器家族。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 与 Dig and Rescue：主机、光驱及内部组件实物照片。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">板件照片含 RVL-CPU-40，模型不宣称复刻首批电路板。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">尺寸与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">主机按横放坐标绘制，公开主体包络不包括外伸件和连接线。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">壁厚、孔位、接点、器件布局及机制细节为原创学习近似。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">空白光盘无游戏数据；电源与电子封装不作为电路设计依据。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可核对的验证记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">15 轮源码 / 654 组件 / 883 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生实体、严格 BRep、完整重建、装配求交及 STEP 回读分别记录。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">图册检查字体、内容覆盖、每页视觉与原生可测量尺寸引用。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改的入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">源码：tools/cadlib/wii.py；逐轮入口位于 scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；修改后同步更新 CAD、图纸与网页。</text></svg>