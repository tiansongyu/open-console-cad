<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">一手结构与尺寸资料</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">Museums Victoria HT38633：合拢实测 115 × 73 × 23 mm。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">Damn Technology 58 张拆解照片及 Duddyfinger 维修照片。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">Toy Heaven 原机照片补充存留电池盖；完整链接见 SOURCES.md。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">近似与非功能边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">馆藏尺寸是实物测量，不冒充原厂制造规格。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">局部壁厚、孔位、元件、导线和图形为近似结构示意。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">无游戏 ROM、工作电路、配合公差或排线疲劳寿命保证。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可查对的独立记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">15 轮源码 / 592 组件 / 778 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生重建、严格实体、多姿态装配和 STEP 回读分别核验。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">12 页 PDF、原生尺寸、逐页视觉和网页检查保留报告。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">源码：tools/cadlib/gamewatch.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；精确实体以 FCStd / STEP 为准。</text></svg>