<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">资料与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">Sony SCPH-5500 说明书仅提供同系列外形尺寸参考。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 128089、Dig and Rescue 提供原版主机与周边实物拆解。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">PSX-SPX 用于核对接口家族；记忆卡大板日期不作确定归属。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">近似与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">270 × 188 × 60 mm 不是经实测确认的 SCPH-1000 原厂尺寸图。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">手柄、记忆卡、孔位、引脚、机构和线束均按学习用途近似绘制。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">不复现制造公差、生产电路、游戏数据或经过验证的运动。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可核对的检查记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">25 轮源码 / 929 组件 / 4149 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">完整重建、严格实体、装配求交与 STEP 回读分别记录。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">字体、内容、每页视觉和原生尺寸引用随交付一并检查。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改的入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">主要源码：tools/cadlib/ps1.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；修改后同步更新 CAD、图纸与网页。</text></svg>