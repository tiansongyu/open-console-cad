<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">公开尺寸依据</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">索尼 2004 年产品规格及 PSP-1000 原始说明书。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">主体 170 × 74 × 23 mm，明确不含最大突出部位。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">4.3 英寸 16:9 TFT；UMD 卡壳 65 × 64 × 4.2 mm，光盘 Ø60。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">结构与版本依据</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">PSP-1000 说明书第 20–23 页：初代控制件与接口。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 社区实机拆解用于模块划分与相对布局参考。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">曲面、孔位、排线、封装和光驱传动细节为近似值。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">检查证据</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">14 轮建模；346 个组件独立源码重建匹配。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生整机、爆炸文件和三份 STEP 回读检查通过。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">最终求交、直接尺寸与原生图纸检查记录见 reports/。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">维护入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">来源：references/SOURCES.md；零件表：COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">逐轮入口：scripts/iterNN_*.py；共享实现：tools/cadlib/psp.py。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">网页网格来自同一原生组件，精确实体以 FCStd / STEP 为准。</text></svg>