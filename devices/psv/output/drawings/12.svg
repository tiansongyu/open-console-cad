<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">公开规格与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">Sony PCH-1000 系列：主体 182 × 83.5 × 18.6 mm。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">5 英寸 16:9 OLED，前后电容触控，前后摄像头。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">用户指定 Wi-Fi OLED；不包括 3G、SIM 或 GPS 硬件。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">参考与近似范围</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">索尼原始产品规格及 PCH-1000/PCH-1100 快速入门指南。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 3G 型拆解仅用于共有模块和结构的照片参考。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">孔位、壁厚、封装、接点、印纹和排线均为近似研究几何。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">检查记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">14 轮源码构建；386 个组件重建匹配。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生整机、爆炸和三份 STEP 回读，最终组件求交检查。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">直接模型尺寸、原生图纸参考与字体检查记录见 reports/。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">维护入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">来源：references/SOURCES.md；清单：COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">逐轮入口：scripts/iterNN_*.py；实现：tools/cadlib/psv.py。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">网页来自同一组 BRep，精确实体以 FCStd / STEP 为准。</text></svg>