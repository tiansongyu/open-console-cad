<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">来源与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">SEGA 官方硬件资料：初代主机外形、接口与整体尺寸。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">Dig and Rescue：HAA-2510 VA2 与 SJ-3500 的实物拆装照片。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">同一机型包含多种板件版本，本模型不宣称复刻首批 VA0 电路。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">尺寸与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">官方主体参考 280 × 212 × 70 mm，图中近似尺寸来自模型。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">局部孔位、壁厚、板件及附件为学习设计，外伸接头另计。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">卡带不含游戏数据，适配器和电子封装不作为电路设计依据。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可核对的交付记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">13 轮源码 / 825 组件 / 1209 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">源码重建、实体求交、原生保存及 STEP 回读分别记录。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">图册另有字体、内容覆盖、逐页视觉和原生尺寸检查。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改与复现</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；索引：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">实现：tools/cadlib/megadrive.py；按轮次入口位于 scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查报告：output/reports/；修改后需重新生成网页与图纸。</text></svg>