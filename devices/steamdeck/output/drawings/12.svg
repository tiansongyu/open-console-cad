<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">公开规格与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">Valve 2022 LCD：整机 298 × 117 × 49 mm，包含控制件。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">7 英寸 16:10 LCD；40 Wh 电池；45 W USB-C 供电。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">本模型采用早期银色罩与黑色电源键，不使用 OLED 版布局。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">参考与近似范围</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">Valve 原始规格、2022-02-02 外部参考图及 iFixit LCD 拆机照片。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">显示区与盖板按参考图；麦克风、控制区和开孔按参考特征修正。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">未直接复制 Valve CAD；局部曲面、壁厚、电芯、接点与排线仍近似。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">检查记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">17 轮建模；当前 500 个组件，本轮未重跑整套源码。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生整机与爆炸、三份 STEP 回读和组件求交检查。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">本轮尺寸、图纸与文件哈希见 fidelity_delivery_checks.json。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">维护入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">来源：references/SOURCES.md；清单：COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">逐轮入口：scripts/iterNN_*.py；实现：tools/cadlib/steamdeck.py。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">网页来自同一组 BRep，精确实体以 FCStd / STEP 为准。</text></svg>