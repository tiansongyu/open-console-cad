<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">公开规格与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">Valve 2022 LCD：整机 298 × 117 × 49 mm，包含控制件。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">7 英寸 16:10 LCD；40 Wh 电池；45 W USB-C 供电。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">本模型采用早期银色罩与黑色电源键，不使用 OLED 版布局。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">参考与近似范围</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">Valve 原始产品技术规格与 iFixit 原始 LCD 拆机照片。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">维修指南中的后期修订图像仅用于辨别，不混入当前版本。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">局部曲面、壁厚、孔位、电芯、接点和排线均为近似研究几何。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">检查记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">16 轮源码构建；498 个组件重建匹配。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生整机与爆炸、三份 STEP 回读和组件求交检查。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">模型尺寸、原生图纸参考、字体与逐页检查见 reports/。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">维护入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">来源：references/SOURCES.md；清单：COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">逐轮入口：scripts/iterNN_*.py；实现：tools/cadlib/steamdeck.py。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">网页来自同一组 BRep，精确实体以 FCStd / STEP 为准。</text></svg>