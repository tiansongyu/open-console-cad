<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">版本与一手资料</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">微软官方家族规格表原版一列提供 343 × 263 × 80 mm 包络。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 原版主机、Kinect 与首发电源拆解指导机械分区。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">微软 C3K1537 原始 FCC 照片区分原版双板和四组振动电机。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">近似与配套边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">附件尺寸、曲率、壁厚、孔位、封装与线缆展示路线均近似。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">普通黑色主体不复制 Day One 特别版字样与镀铬方向键。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">不含游戏介质或可选充电套件；电路与光学组件不具实际功能。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可查对的交付记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">28 轮源码 / 1791 组件 / 1870 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">源码重建、严格实体、装配求交和 STEP 回读分别保留报告。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">原生图纸、字体、逐页视觉、尺寸和网页随交付一起验证。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">源码：tools/cadlib/xboxone.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；修改后同步原生 CAD、图册和网页。</text></svg>