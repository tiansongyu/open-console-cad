<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">来源与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">任天堂原始硬件页：主体尺寸、灰色控制器及接口说明。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 74923 与 Dig and Rescue：机身、控制器和附件实物照片。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">NUS-CPU-04 是内部布局参考，不宣称复刻首批电路板。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">尺寸与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">官方主体参考为 260 × 190 × 73 mm，图中近似值来自实际模型。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">孔位、壁厚、曲面与内部结构为学习设计，外伸线缆及附件另计。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">卡带和存储卡无游戏数据，电源与电子封装不作为电路设计依据。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可核对的验证记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">15 轮源码 / 747 组件 / 1352 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生实体、严格 BRep、完整重建、装配求交及 STEP 回读分别记录。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">图册另外检查字体、内容覆盖、每页视觉以及原生尺寸引用。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改的入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">源码：tools/cadlib/n64.py；各轮入口位于 scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；修改后同步更新 CAD、图纸与网页。</text></svg>