<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">一手资料与版本选择</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">微软存档 Technical Specifications：外形明确标作近似。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">Van’s Hardware 2001 发售期拆解：主动 GPU、四枚内存与双驱动器。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">Fictiv 原版 Duke 拆解：单主板、独立碳贴片、六穹顶方向键。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">补充参考与非功能边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 仅参考原版外壳与托架，不复制其后期被动 GPU 主板。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">局部尺寸、壁厚、线束和器件为照片指导近似，无制造公差。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">无可用电路、实际存储容量、热性能或电源安全认证。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">交付与对应关系</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">18 轮建模 / 978 组件 / 1007 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生工程、STEP、图册与网页共享组件身份与来源边界。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">几何、干涉、源码重建、图册和网页验收记录位于 reports/。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">源码：tools/cadlib/xbox.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">Rebuild_OriginalXbox.FCMacro 从源码生成独立重建目录。</text></svg>