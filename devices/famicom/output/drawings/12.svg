<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">公开规格</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">任天堂原始说明书：主机宽 150、深 220、高 60 mm。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">专用适配器标称 DC 10 V / 850 mA；主机耗电约 4 W。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">一号手柄为 START/SELECT，二号手柄为 MIC/VOLUME。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">版本与近似范围</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">主逻辑板采用 iFixit 拆机中 HVC-CPU-GPM-02 布局参考。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">不代表最早的方形按键手柄或所有生产批次的电路板。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">壁厚、孔位、封装、线缆、卡带与附件尺寸为近似学习值。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">验证与文件</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">16 轮源码；634 个组件条目参与重建核对。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生整机与爆炸装配、STEP 回读及实体求交分别检查。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">Kami 图册包含字体、内容覆盖和逐页视觉验证。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">维护入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">参考：references/SOURCES.md；组件清单：COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">逐轮入口：scripts/iterNN_*.py；实现：tools/cadlib/famicom.py。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">Parameters 中 Depth(Y) 与 Height(Z) 保留原有表达式别名。</text></svg>