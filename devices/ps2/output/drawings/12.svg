<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">资料与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">Sony SCPH-10000 原版说明书提供 301 × 182 × 78 mm 主体包络。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">Dig and Rescue 与 Secret Base Manager 提供初代主机拆解。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">awgs Foundry 与 RHMVY 提供后期同系列手柄和记忆卡照片。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">近似与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">控制器与记忆卡的局部尺寸及内部板型不能作为首发批次证明。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">壳体分割、壁厚、孔位、元件、机构和线束均按学习用途近似绘制。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">不复现制造公差、生产电路、游戏数据或经过验证的运动。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可核对的检查记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">34 轮源码 / 1352 组件 / 6992 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">完整重建、严格实体、装配求交和 STEP 回读分别保留报告。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">字体、逐页视觉、模型尺寸与原生图纸引用随交付检查。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改的入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">主要源码：tools/cadlib/ps2.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；修改后同步更新 CAD、图纸与网页。</text></svg>