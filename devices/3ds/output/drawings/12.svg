<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">官方尺寸依据</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">Nintendo 3DS CTR-001：闭合 134 × 74 × 21 mm。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">上屏 76.8 × 46.08 mm；下屏 61.44 × 46.08 mm。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">来源：Nintendo 官方说明书第 20–23、100–101 页。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">结构参考</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 2011 Nintendo 3DS 实机拆解。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">局部外形、壁厚、孔位和内部模块为近似设计。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">充电底座、触控笔与 160° 开角属于展示模型参数。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">检查证据</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">13 轮建模；324 个组件独立源码重建匹配。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生展开、闭合、爆炸文件及四份 STEP 已回读检查。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">最终装配实体求交、图纸尺寸和字体检查记录见 reports/。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">维护入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">来源链接：references/SOURCES.md。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">零件索引：COMPONENTS.csv；源码：scripts/iterNN_*.py。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">网页网格由同一 FreeCAD 组件导出，精确实体以 FCStd / STEP 为准。</text></svg>
