<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">来源与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">任天堂硬件、各部功能及 2012 年首发说明：主体、端口与套装。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 11796 拆解：主机、GamePad 板件和装配层次。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">任天堂原装电源照片：独立适配器与对应的专用插头。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">尺寸与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">两个主体的公开包络不包括外伸按钮、脚垫和连接线。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">孔位、器件、接点、线数、机构及附件尺寸为学习近似。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">Basic 不混入 Premium 支架，原版 1500 mAh 电池保持独立。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可核对的检查记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">22 轮源码 / 707 组件 / 1039 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">完整源码重建、严格实体、装配求交和 STEP 回读分别记录。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">图册校验内容、字体、每页视觉和可回读的原生尺寸。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改的入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">源码：tools/cadlib/wiiu.py；逐轮入口位于 scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；修改后同步更新 CAD、图纸和网页。</text></svg>