<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">一手资料与版本选择</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">日版使用说明书规格提供 200 × 242 × 74 mm 包络及原装双手柄配置。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">任天堂 1992 年维修手册指导上下 62P 连接器、排线磁芯和退卡结构。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">早期主板、声卡、原版手柄与 HVC-002 拆机照片指导机械分件。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">近似及附件边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">局部曲率、孔位、封装、机构尺寸及线缆展示路线均近似。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">采用有独立声卡的早期主板，不混入后期 1CHIP 或迷你复刻版。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">AC / AV 为另售学习件；电路、线缆与电源均非功能性模型。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可查对的交付记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">21 轮源码 / 1918 组件 / 2224 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">源码重建、严格实体、装配求交及 STEP 回读分别保留报告。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">原生图纸、字体、逐页视觉、尺寸和网页随交付一起核对。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">源码：tools/cadlib/sfc.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；修改后同步 CAD、图册与网页。</text></svg>