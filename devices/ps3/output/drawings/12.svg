<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">资料与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">Sony 日本原版手册及快速参考给出主体包络与套装清单。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">Sony 维修资料与 iFixit 原版拆解提供机构及 COK-001 布局依据。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">SIXAXIS 同代拆解用于无振动结构；不宣称精确制造尺寸。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">近似与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">325 × 274 × 98 mm 主体参考包络不含最大突出部。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">曲率、壁厚、元件、孔位、线束与传动间隙均按学习用途近似。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">不复现制造公差、生产电路、游戏数据或实际电气功能。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可核对的检查记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">30 轮源码 / 1592 组件 / 1676 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">源码重建、严格实体、装配求交与 STEP 回读分别保留报告。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">图册字体、逐页视觉、模型尺寸与原生图纸引用随交付检查。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改的入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">源码：tools/cadlib/ps3.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；修改后同步 CAD、图纸及网页。</text></svg>