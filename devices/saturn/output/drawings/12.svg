<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">资料与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">世嘉官方家族及周边资料：型号、接口和原始配件类别。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">Dig and Rescue：HST-3200 及 HSS-0101 实物拆解。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">手柄内构照片含浅色家族版本，外观依据原始灰色照片。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">近似与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">HST-3210 的 260 × 230 × 83 mm 仅作为家族包络参考。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">本 HST-3200 模型的局部尺寸、引脚、机构与线束均为学习近似。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">未复现生产电路、制造公差、光盘数据或经过验证的运动。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可核对的检查记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">22 轮源码 / 715 组件 / 2558 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">完整重建、严格实体、装配求交与 STEP 回读分别记录。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">字体、内容、每页视觉和原生尺寸引用随交付一并检查。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改的入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">主要源码：tools/cadlib/saturn.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；修改后同步更新 CAD、图纸与网页。</text></svg>