<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">一手资料与版本范围</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">微软官方 Disc design：151 × 151 × 301 mm 外形包络。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 2020 年原机拆解：34 张照片核对双板、光驱与散热结构。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">微软 2023 Series 控制器维修手册：结构参考，不保证首发板号。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">近似与非功能边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">壁厚、孔位、器件、线路和手柄曲率均为照片指导近似。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">无可用电路、制造公差、热性能或电源安全认证。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">参考照片不作为自产图像分发，所有模型图由 CAD 生成。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可查对的交付记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">19 轮建模 / 1047 组件 / 1067 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">原生重建、严格实体、装配干涉和 STEP 回读分别检查。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">12 页 A3 图册、原生尺寸与网页检查均附独立记录。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">源码：tools/cadlib/seriesx.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">原生文件保留参数与历史，精确实体以 FCStd / STEP 为准。</text></svg>