<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">资料与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">Microsoft 2005 手册和首发公告确定原版功能及套装范围。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">Copetti、Ben Heck 的原版实机照片指导 Xenon 机构布局。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">2005 FCC 原始手柄照片与后期变更说明用于区分板型。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">近似与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">309 × 258 × 83 mm 是近似工作包络，外置硬盘和突出部另计。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">曲率、壁厚、元件、孔位、线束与传动间隙均按学习用途近似。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">203 W 电源内部为结构示意，不复现制造公差或实际电气功能。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">可核对的检查记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">35 轮源码 / 2005 组件 / 3141 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">源码重建、严格实体、装配求交与 STEP 回读分别保留报告。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">图册字体、逐页视觉、模型尺寸与原生图纸引用随交付检查。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改的入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">源码：tools/cadlib/xbox360.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；修改后同步 CAD、图纸及网页。</text></svg>