<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">资料与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">Nintendo 原始规格：144.5 × 82 × 24.5 mm，无照明反射 TFT。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">Nintendo 原版使用手册：外部控制、接口和双 AA 电池。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">iFixit 与 Gekkio 贡献者实物：AGB-CPU-02、40 针 LCD 与早期卡带。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">近似与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">屏幕可视区域采用官方 61.2 × 40.8 mm；曲率及壁厚近似。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">元件、触点、弹簧与走线为非功能结构，不提供制造电路或公差。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">另附空白 Game Pak 无游戏数据，外壳与内部尺寸为学习近似。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">交付与可核对记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">17 轮源码 / 779 组件 / 899 实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">源码重建、严格实体、装配求交、STEP 回读分别保留报告。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">图册字体、逐页视觉、尺寸和原生图纸引用随交付检查。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">继续修改入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；清单：output/COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">源码：tools/cadlib/gba.py；逐轮入口：scripts/。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">检查：output/reports/；模型修改后同步图册与网页网格。</text></svg>