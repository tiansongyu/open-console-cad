<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="214mm" viewBox="0 0 396 214"><style>text {font-family:TsangerJinKai02, Noto Serif CJK SC, serif;font-weight:400;}</style><text x="12.0000" y="16.0000" font-size="4" text-anchor="start" fill="#1B365D">资料与版本</text><text x="12.0000" y="27.0000" font-size="3.2" text-anchor="start" fill="#141413">原厂维修手册：双电路板、12 芯排线与主要元件类别。</text><text x="12.0000" y="35.0000" font-size="3.2" text-anchor="start" fill="#141413">1977 年用户说明书：主机、双摇杆、旋钮对及电视连接附件。</text><text x="12.0000" y="43.0000" font-size="3.2" text-anchor="start" fill="#141413">实物照片：厚壁底壳、CX10 顶标及 CX30-04 早期标签。</text><text x="12.0000" y="67.0000" font-size="4" text-anchor="start" fill="#1B365D">尺寸与内容边界</text><text x="12.0000" y="78.0000" font-size="3.2" text-anchor="start" fill="#141413">本模型主体实测约 346 × 232.443 × 88.304 mm。</text><text x="12.0000" y="86.0000" font-size="3.2" text-anchor="start" fill="#141413">整体与局部尺寸均为近似值；没有核实原厂尺寸图或实机测量。</text><text x="12.0000" y="94.0000" font-size="3.2" text-anchor="start" fill="#141413">卡带无 ROM；适配器及开关内部不定义电气网络或制造参数。</text><text x="12.0000" y="118.0000" font-size="4" text-anchor="start" fill="#1B365D">验证记录</text><text x="12.0000" y="129.0000" font-size="3.2" text-anchor="start" fill="#141413">23 轮源码；684 个组件与 1511 个实体。</text><text x="12.0000" y="137.0000" font-size="3.2" text-anchor="start" fill="#141413">重建、原生实体、装配求交及 STEP 回读分别保存检查报告。</text><text x="12.0000" y="145.0000" font-size="3.2" text-anchor="start" fill="#141413">图册另有字体、内容覆盖、逐页视觉和原生尺寸核对。</text><text x="12.0000" y="169.0000" font-size="4" text-anchor="start" fill="#1B365D">维护入口</text><text x="12.0000" y="180.0000" font-size="3.2" text-anchor="start" fill="#141413">资料：references/SOURCES.md；部件索引：COMPONENTS.csv。</text><text x="12.0000" y="188.0000" font-size="3.2" text-anchor="start" fill="#141413">逐轮源码：scripts/iterNN_*.py；实现：tools/cadlib/atari2600.py。</text><text x="12.0000" y="196.0000" font-size="3.2" text-anchor="start" fill="#141413">原生图页与 PDF 需随几何更新；检查记录位于 output/reports/。</text></svg>